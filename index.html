
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Yellow Person 💛</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow"></div>

    <main class="container">

        <div class="card">

            <p class="top-label">A LITTLE SURPRISE FROM MY SIDE</p>

            <div class="cake">🌻</div>

            <h1>
                Hello, My
                <span>PHOOL</span>
            </h1>

            <div class="decorative-divider">
                <span>♡</span>
            </div>

            <p class="subtitle">
                A LITTLE THING,
                MADE JUST ONLY FOR YOU
            
            </p>

            <div class="birthday-form">

                <label for="dob">
                    <p> CHOOSE </p>
                    WHEN IS YOUR SPECIAL DAY?
                    <span>✧</span>
                </label>

                <input
                    type="date"
                    id="dob"
                    name="birthday"
                    required
                >

                <button id="continueBtn" type="button">
                    Open Your Surprise
                    <span>♡</span>
                </button>

                <p id="message" aria-live="polite"></p>

            </div>

            <p class="bottom-note">
                Made with a little extra love 💗
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
